# Shared appearance defaults for the manual and XDM Xrtg sessions.
#
# Machine-local values belong in /usr/X/lib/xrtg/session.conf.local.  The
# installer writes that file when it is given a backdrop path; no backdrop
# image is kept in this repository.

XRTG_ROOT_COLOR="#1b2129"
XRTG_BACKDROP=
# Expanded in the authenticated user's session. Set to empty to disable.
XRTG_XMODMAP="$HOME/.Xmodmap"

# XDM only: default (the existing twm/tvtwm desktop), amiwm or openlook.
# Override in session.conf.local or put one name in $HOME/.xrtg-session.
# Login-time F1/F2/F3 overrides these preferences; F4 is failsafe.
XRTG_SESSION=default
